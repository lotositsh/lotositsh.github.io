<script>
const usernameInput = document.getElementById("username");
const maxCountSelect = document.getElementById("maxCount");
const dotsSelect = document.getElementById("dotsCount");
const emailsArea = document.getElementById("emails");
const counterLabel = document.getElementById("counter");
const maxText = document.getElementById("maxText");

// "example@gmail.com" -> "example"
function getUsername() {
  return usernameInput.value.trim().split("@gmail.com")[0].replace(/[^a-zA-Z0-9]/g, "");
}

// Обновление списка точек: от 1 до (длина имени - 1)
function updateDotsOptions() {
  const maxDots = Math.max(getUsername().length - 1, 0);
  const prev = dotsSelect.value;
  dotsSelect.innerHTML = '<option value="all">All (0 - ' + maxDots + ')</option>';
  for (let i = 1; i <= maxDots; i++) {
    const opt = document.createElement("option");
    opt.value = i;
    opt.textContent = i;
    dotsSelect.appendChild(opt);
  }
  if ([...dotsSelect.options].some(o => o.value === prev)) {
    dotsSelect.value = prev;
  }
}

// Генератор вариантов ровно с k точками
function* rec(s, i, cur, k) {
  if (i === s.length) {
    if (k === 0) yield cur;
    return;
  }
  const gaps = s.length - i;
  if (k > gaps) return;
  if (k > 0) yield* rec(s, i + 1, cur + "." + s[i], k - 1);
  if (k < gaps) yield* rec(s, i + 1, cur + s[i], k);
}

function* generate(s, dots) {
  if (dots === "all") {
    for (let k = 0; k <= s.length - 1; k++) {
      yield* rec(s, 1, s[0], k);
    }
  } else {
    yield* rec(s, 1, s[0], parseInt(dots));
  }
}

function updateEmails(username) {
  const limit = parseInt(maxCountSelect.value);
  const result = [];
  for (const name of generate(username, dotsSelect.value)) {
    if (result.length >= limit) break;
    result.push(name + "@gmail.com");
  }
  emailsArea.value = result.join("\r\n");
  counterLabel.innerText = "Generated: " + result.length;
}

usernameInput.addEventListener("input", updateDotsOptions);

maxCountSelect.addEventListener("change", function () {
  maxText.innerText = "Max " + maxCountSelect.value + " gmail in text area";
});

document.getElementById("generate").addEventListener("click", function () {
  if (!/@gmail\.com$/.test(usernameInput.value.trim())) {
    alert("Please enter a valid Email Address");
    return;
  }
  const username = getUsername();
  if (username.length > 1) {
    updateEmails(username);
  }
});

document.getElementById("copy").addEventListener("click", function () {
  emailsArea.select();
  document.execCommand("copy");
});

updateDotsOptions();
</script>
